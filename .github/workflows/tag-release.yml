name: tag-release

on:
  push:
    branches: [main]
    paths:
      - .claude-plugin/plugin.json
  # A promotion pushes main with GITHUB_TOKEN, and a push made with that token creates no
  # workflow runs. So .github/workflows/promote.yml dispatches this workflow by hand after
  # it moves the ref. The push trigger above stays for any other route onto main.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  tag-release:
    name: tag-release
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0, so the checkout is not shallow and it brings every tag with it.
      # The existence check below needs the tags, and pushing a new tag from a shallow
      # clone is a path worth not relying on.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tag whatever version main holds, unless that tag is already there. Re-running the
      # job is a no-op, and so is a dispatch on an already-tagged main.
      #
      # This deliberately does NOT compare against HEAD~1. A promotion fast-forwards main
      # over every commit dev collected, so HEAD~1 is the second-newest dev commit rather
      # than main's previous tip. Most of those commits leave the version alone, so a
      # HEAD~1 comparison would read "unchanged" and skip the tag for a release that really
      # did bump. The tag's own existence is the honest record of what is already tagged.
      - name: Tag the release
        run: |
          set -euo pipefail
          new="$(jq -r '.version // empty' .claude-plugin/plugin.json)"
          if [ -z "$new" ]; then
            echo "tag-release: no version in .claude-plugin/plugin.json at HEAD" >&2
            exit 1
          fi
          tag="v${new}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "tag-release: ${tag} already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" -m "acstack ${new}"
            git push origin "refs/tags/${tag}"
            echo "tag-release: created ${tag}."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Install npm with staged publish support
        run: |
          npm install -g npm@11.19.0
          npm --version

      - name: Stage npm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          name="$(jq -r '.name' package.json)"
          version="$(jq -r '.version' package.json)"
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not set. Add an npm automation token as the NPM_TOKEN repository secret."
            exit 1
          fi
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "npm: ${name}@${version} already published, nothing to stage."
            exit 0
          fi
          if npm stage publish . --access public --provenance 2>&1 | tee /tmp/npm-stage.log; then
            echo "npm: staged ${name}@${version}. Approve it on npmjs.com to publish."
            exit 0
          fi
          if grep -q "Version uniqueness check failed unexpectedly" /tmp/npm-stage.log; then
            echo "npm: ${name}@${version} appears to be staged already. Approve it on npmjs.com to publish."
            exit 0
          fi
          exit 1
